name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build plugins and tests
        run: cmake --build build --target LuckySeven_VST3 LuckySeven_AU LuckySevenTests

      - name: Test
        run: ctest --test-dir build --output-on-failure
